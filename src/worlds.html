<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Worlds</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #1e1e1e;
        color: #ddd;
        font-family: -apple-system, "Segoe UI", sans-serif;
        font-size: 13px;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      #titlebar {
        order: -1; /* visually first, but last in DOM/tab order so Tab reaches content before Close */
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 32px;
        padding: 0 4px 0 10px;
        background: #252525;
        border-bottom: 1px solid #333;
        -webkit-app-region: drag;
        user-select: none;
      }
      #titlebar-label {
        color: #bbb;
        font-size: 12px;
      }
      #titlebar-close {
        -webkit-app-region: no-drag;
        background: transparent;
        border: none;
        color: #aaa;
        font-size: 13px;
        line-height: 1;
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
      }
      #titlebar-close:hover {
        background: #c42b1c;
        color: #fff;
      }
      #layout {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      #tree-pane {
        width: 220px;
        border-right: 1px solid #333;
        display: flex;
        flex-direction: column;
      }
      #tree-list {
        flex: 1;
        overflow-y: auto;
        margin: 0;
        padding: 4px;
        list-style: none;
      }
      #tree-list li {
        padding: 4px 8px;
        border-radius: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #tree-list li.selected {
        background: #094771;
        color: #fff;
      }
      #tree-list:focus-visible {
        outline: 1px solid #0a84ff;
        outline-offset: -1px;
      }
      #tree-buttons {
        display: flex;
        gap: 4px;
      }
      button {
        background: #2d2d2d;
        color: #ddd;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
      }
      button:hover {
        background: #3a3a3a;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #content-pane {
        flex: 1;
        padding: 16px;
      }
      #empty-message {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
        color: #888;
      }
      .field-row {
        display: flex;
        flex-direction: column;
        margin-bottom: 12px;
      }
      .field-row label {
        margin-bottom: 4px;
        color: #aaa;
      }
      .field-row input {
        background: #2d2d2d;
        color: #ddd;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 6px 8px;
        font-size: 13px;
      }
      .field-row input:focus {
        outline: 1px solid #0a84ff;
      }
      #footer {
        flex: 0 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px;
        border-top: 1px solid #333;
      }
      #connect-btn:not(:disabled) {
        background: #0a5cc2;
        border-color: #0a5cc2;
        color: #fff;
      }
      #connect-btn:hover:not(:disabled) {
        background: #1670e0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="layout">
        <div id="tree-pane">
          <ul id="tree-list" tabindex="0" role="listbox" aria-label="Worlds"></ul>
        </div>
        <div id="content-pane">
          <div id="empty-message">Select or add a world</div>
          <div id="form" style="display: none">
            <div class="field-row">
              <label for="name-input">Name</label>
              <input id="name-input" type="text" />
            </div>
            <div class="field-row">
              <label for="host-input">Host</label>
              <input id="host-input" type="text" />
            </div>
            <div class="field-row">
              <label for="port-input">Port</label>
              <input id="port-input" type="number" min="1" max="65535" />
            </div>
          </div>
        </div>
      </div>
      <div id="footer">
        <div id="tree-buttons">
          <button id="add-btn" title="Add world">Add</button>
          <button id="delete-btn" title="Delete selected world" disabled><u>D</u>elete</button>
        </div>
        <button id="connect-btn" title="Connect" disabled>Connect</button>
      </div>
      <div id="titlebar">
        <span id="titlebar-label">Worlds</span>
        <button id="titlebar-close" title="Close">✕</button>
      </div>
    </div>
    <script src="../dist/worlds-renderer.js"></script>
  </body>
</html>
