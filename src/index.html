<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"
    />
    <title>Moolin</title>
    <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="terminal"></div>
      <hr id="divider" />
      <textarea id="input-area" rows="1" spellcheck="false" hidden></textarea>
      <div id="status-bar" data-status="disconnected">
        <span id="status-text">Not connected</span>
        <span class="hint">Press Ctrl+O to choose a world</span>
      </div>
    </div>

    <dialog id="worlds-dialog">
      <div class="worlds-layout">
        <div class="worlds-sidebar">
          <ul id="worlds-tree" role="tree" aria-label="Worlds" tabindex="0"></ul>
          <button id="new-world-btn" type="button">New World</button>
        </div>

        <div class="worlds-content">
          <div id="worlds-error" class="worlds-error" hidden></div>

          <div id="empty-pane" class="pane">
            <p class="placeholder">
              Select a world or character, or create a new world. Right-click a world to add characters.
            </p>
          </div>

          <form id="world-pane" class="pane" hidden>
            <label>Name <input name="name" type="text" spellcheck="false" /></label>
            <label>Host <input name="host" type="text" spellcheck="false" /></label>
            <label>Port <input name="port" type="number" min="1" max="65535" /></label>
            <label class="check"><input name="tls" type="checkbox" /> Use TLS</label>
            <label class="check indented">
              <input name="tlsAllowUntrusted" type="checkbox" /> Accept untrusted certificates (self-signed, expired)
            </label>
            <label class="check"><input name="autoLogin" type="checkbox" /> Log in characters automatically</label>
            <label>Login command <input name="loginTemplate" type="text" spellcheck="false" /></label>
            <p class="hint">
              {{character}} and {{password}} are replaced with the character's name and password. \r sends a
              carriage return, \n a line feed, \\ a backslash.
            </p>
          </form>

          <form id="character-pane" class="pane" hidden>
            <label>Name <input name="name" type="text" spellcheck="false" /></label>
            <label>
              Password
              <span class="password-row">
                <input name="password" type="password" spellcheck="false" />
                <button id="show-password-btn" type="button">Show</button>
              </span>
            </label>
          </form>

          <div class="worlds-buttons">
            <button id="close-btn" type="button">Close</button>
            <button id="connect-btn" type="button" class="primary">Connect</button>
          </div>
        </div>
      </div>
    </dialog>

    <script src="../dist/renderer.js"></script>
  </body>
</html>
