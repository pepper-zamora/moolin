<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>moolin</title>
    <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      #terminal {
        flex: 1 1 auto;
        min-height: 0;
      }
      #divider {
        flex: 0 0 auto;
        height: 1px;
        margin: 1px 0;
        border: none;
        background: #333;
      }
      #input-area {
        flex: 0 0 auto;
        box-sizing: border-box;
        resize: none;
        overflow-y: hidden;
        background: #100000; /* subtle red: not a TLS connection */
        color: #ddd;
        border: none;
        outline: none;
        font-family: Menlo, Consolas, monospace;
        font-size: 14px;
        line-height: 1.3;
        padding: 2px 4px;
      }
      #input-area.secure {
        background: #001000; /* subtle green: connected over TLS */
      }
      .xterm-viewport::-webkit-scrollbar {
        width: 14px;
      }
      .xterm-viewport::-webkit-scrollbar-track {
        background: transparent;
      }
      .xterm-viewport::-webkit-scrollbar-thumb {
        background-color: #5a5a5a;
        border-radius: 7px;
        border: 3px solid transparent;
        background-clip: content-box;
      }
      .xterm-viewport::-webkit-scrollbar-thumb:hover {
        background-color: #7a7a7a;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="terminal"></div>
      <hr id="divider" />
      <textarea id="input-area" rows="1" spellcheck="false" autofocus></textarea>
    </div>
    <script src="../dist/renderer.js"></script>
  </body>
</html>
