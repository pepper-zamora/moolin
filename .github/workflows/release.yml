name: Release

# Builds installers on each OS and attaches them to a GitHub Release when a
# version tag (v0.1.0, ...) is pushed. On every push to dev, on a pull request
# into dev or main, or when run manually, it only builds and tests, leaving
# the installers as the run's artifacts.
on:
  push:
    branches: [dev]
    tags: ["v*"]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# A newer push to dev or to a pull request replaces its run in progress.
# Release (tag) runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Linux packaging tools (rpm and pacman targets)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: npm ci
      - run: npm test
        if: runner.os == 'Linux'
      # Signing is optional: with no secrets set, macOS and Windows builds
      # come out unsigned. The macOS secrets are passed on only to the macOS
      # build, and only when set: electron-builder takes even an empty
      # CSC_LINK as a certificate path, and fails.
      - name: Build
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            if [ -n "$MAC_CERT_P12_BASE64" ]; then
              export CSC_LINK="$MAC_CERT_P12_BASE64" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            fi
            if [ -n "$MAC_APPLE_ID" ]; then
              export APPLE_ID="$MAC_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$MAC_APPLE_APP_SPECIFIC_PASSWORD" APPLE_TEAM_ID="$MAC_APPLE_TEAM_ID"
            fi
          fi
          npm run ${{ matrix.script }} -- --publish never
      - uses: actions/upload-artifact@v6
        with:
          name: moolin-${{ runner.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.pacman
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
